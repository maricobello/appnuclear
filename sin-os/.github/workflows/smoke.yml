name: Smoke test da produção

# Chama todas as rotas de API da produção e falha se alguma responder erro.
# Roda sob demanda (Actions → Run workflow) e uma vez por dia.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 12 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      URL: ${{ vars.SIN_OS_URL || 'https://sinos-iota.vercel.app' }}
      # a plataforma exige login; o robô entra com o mesmo segredo da Vercel
      TOKEN: ${{ secrets.ADMIN_KEY || secrets.CRON_SECRET }}
    steps:
      - name: Rotas de API
        run: |
          fail=0
          for path in "/api/status" "/api/health" "/api/pld" "/api/pld/coletor" "/api/confianca" "/api/renovaveis" "/api/renovaveis/historico" "/api/rede" "/api/termicas" "/api/planejamento" "/api/alertas" "/api/brasil" "/api/global" "/api/clima" "/api/auditoria" \
                      "/api/previsao?sub=SE" "/api/previsao?sub=NE" "/api/arbitragem?sub=SE" "/api/bess" "/api/pld-mensal" "/api/auditoria/selfeval" "/api/fontes" "/api/auditoria/modelos"; do
            # a auditoria dos modelos roda tudo no PLD real (até ~4 min na primeira do dia)
            code=$(curl -s -o body.json -w '%{http_code}' --max-time 300 -H "Authorization: Bearer $TOKEN" "$URL$path")
            echo "== $path → HTTP $code"
            python3 - "$path" <<'PY' || true
          import json, sys
          path = sys.argv[1]
          try:
              d = json.load(open("body.json"))
          except Exception as e:
              print("   resposta não é JSON:", e); sys.exit(0)
          if "error" in d and d["error"]:
              print("   erro:", str(d["error"])[:300])
          if path.startswith("/api/previsao"):
              f = d.get("forecast") or d
              bt = f.get("backtest") or {}
              print("   backtest dias:", bt.get("days"), "MAE:", bt.get("maeLear"), "rMAE:", bt.get("rmae"), "cobertura ACI:", (bt.get("aci") or {}).get("coverage"))
              for w in f.get("warnings") or []:
                  print("   aviso:", w)
          if path.startswith("/api/arbitragem"):
              b = d.get("bess") or {}
              print("   intrínseco:", b.get("intrinsicRS"), "opcionalidade:", b.get("extrinsicRS"), "teto:", b.get("perfectForesightRS"), "solver:", b.get("solver"))
          if path.startswith("/api/bess"):
              f = d.get("finance") or {}
              print("   receita/ano:", f.get("revenueYear1"), "TIR:", f.get("irr"), "payback:", f.get("paybackYears"), "LCOS equilíbrio:", f.get("breakevenLcos"))
          # nenhum dado simulado em produção: aponta qualquer "simulated": true na resposta
          def walk(o, where=""):
              if isinstance(o, dict):
                  if o.get("simulated") is True:
                      yield where or "(raiz)", o.get("fallback") or o.get("id") or ""
                  for k, v in o.items():
                      yield from walk(v, f"{where}.{k}" if where else k)
              elif isinstance(o, list):
                  for i, v in enumerate(o[:50]):
                      yield from walk(v, f"{where}[{i}]")
          sims = list(walk(d))
          for w, why in sims:
              print("   SIMULADO:", w, "—", str(why)[:400])
          if sims:
              open("simulated.flag", "a").write(path + "\n")
          if path == "/api/pld":
              print("   fonte:", (d.get("fonte") or {}).get("descricao"), "| oficial:", (d.get("fonte") or {}).get("oficial"))
              for x in d.get("submercados") or []:
                  print("  ", x.get("sub"), "agora:", x.get("agora"), "| hoje média:", (x.get("hoje") or {}).get("media"), "| amanhã média:", (x.get("amanha") or {}).get("media"))
          if path == "/api/pld/coletor":
              print("   coletor configurado:", d.get("configurado"), "| dias recentes:", ", ".join(f"{x['data']}{'' if x['oficial'] else ' (estimado)'}" for x in d.get("dias_recentes") or []))
          if path == "/api/confianca":
              print("   revisões 30d:", d.get("totalRevisions30d"))
              for x in d.get("seals") or []:
                  print("  ", x.get("source"), "| selo:", x.get("level"), "| completude:", x.get("completeness"), "| obs:", "; ".join(x.get("reasons") or []))
          if path == "/api/rede":
              ic = d.get("interchange") or {}
              print("   intercâmbio:", ic.get("from"), "a", ic.get("to"), "|", "; ".join(f"{p['pair']} descolado {p['decoupledHours']}/{p['pricedHours']} h" for p in ic.get("pairs") or []))
              g = d.get("grid") or {}
              v = g.get("validation") or {}
              print("   fluxo AC: dia", g.get("date"), "| idade", d.get("gridAgeDays"), "dias | atrasado:", d.get("gridStale"), "| convergiu", v.get("converged"), "/", v.get("hours"), "|", "; ".join(f"{x['par']} {x['status']}" for x in v.get("intercambio") or []))
          if path == "/api/planejamento":
              r = d.get("report") or {}
              m = next((x for x in (r.get("resultado") or {}).get("meses") or [] if x.get("cobertura", 0) >= 0.999), None)
              head = (m or {}).get("pld_ponta") or (m or {}).get("pld") or {}
              print("   planejamento: dados até", r.get("asof"), "| idade", d.get("ageDays"), "dias | atrasado:", d.get("stale"), "|", (r.get("solver") or {}).get("iterations"), "iterações |",
                    "PLD", (m or {}).get("mes"), "P50:", ", ".join(f"{s} {(head.get(s) or {}).get('p50')}" for s in ("SE", "S", "NE", "N")))
          if path == "/api/renovaveis":
              c = d.get("curtailment") or {}
              t = c.get("totals") or {}
              print("   corte:", c.get("from"), "a", c.get("to"), "| eólica GWh:", round((t.get("eolicaMWh") or 0) / 1000), "| solar GWh:", round((t.get("solarMWh") or 0) / 1000), "| qualidade:", c.get("quality"))
              print("   convenção de hora:", (d.get("hourCheck") or {}).get("ok"), "| balanço:", (d.get("netLoad") or {}).get("quality"))
          if path == "/api/status":
              print("  ", json.dumps(d)[:400])
          if path == "/api/fontes":
              print("   fontes:", d.get("counts"))
              for x in d.get("sources") or []:
                  if x.get("state") not in ("live", "off"):
                      print("  ", x.get("id"), x.get("state"), "—", str(x.get("note") or "")[:160])
          if path == "/api/auditoria/modelos":
              print("   nota:", d.get("score"), d.get("counts"), "| registro:", ", ".join(f"{t['sub']} {t['days']}d" for t in d.get("trackRecord") or []))
              for c in d.get("checks") or []:
                  if c.get("status") != "pass":
                      print("  ", c.get("status"), c.get("id"), "—", c.get("display"))
          PY
            if [ "$code" -ge 400 ]; then fail=1; fi
          done
          if [ -f simulated.flag ]; then echo "::error::dado simulado em produção: $(tr '\n' ' ' < simulated.flag)"; fail=1; fi
          exit $fail
      - name: Iara (Groq online?)
        if: always()
        run: |
          curl -s --max-time 30 -H "Authorization: Bearer $TOKEN" "$URL/api/assistente" > iara.json || true
          python3 - <<'PY'
          import json
          try:
              d = json.load(open("iara.json"))
          except Exception as e:
              print("::warning::/api/assistente não respondeu JSON:", e); raise SystemExit(0)
          print("configurada:", d.get("configured"), "| online:", d.get("online"), "| modelo:", d.get("model"), "| transcrição:", d.get("sttModel"), "| latência ms:", d.get("latencyMs"), "| código de acesso:", d.get("accessCodeRequired"))
          if not d.get("configured"):
              print("::notice::Iara desligada no servidor: cadastre GROQ_API_KEY (Sensitive) na Vercel")
          elif not d.get("online"):
              print("::warning::Groq fora do ar ou chave recusada:", d.get("error"))
          PY
